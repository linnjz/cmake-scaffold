[project]
name = "MyApp"
version = "1.0.0"
description = ""
homepage_url = ""
languages = ["C","CXX"]
c_standard = 23
cxx_standard = 23
# 1. type: fixed, size: 0 <= size <= cpu.actual.max_size
# 2. type: factor, size: 0.0 <= size <= 1.0
# 3. size = 0 (fixed) or 0.0 (factor) means all CPU threads (cpu.actual.max_size), not 0
# Watch out for floating-point multiplication truncation
# Python automatic range correction
jobs = { type = "fixed", size = 0 }
# Whether to inject include(CTest) + enable_testing() in the root CMakeLists.txt
# When false, testPresets are generated as usual, but ctest has no tests to run; you can manually add those two lines to fix it
test_enabled = false

[[project.sub]]
name = ""
version = "1.0.0"
description = ""
target_type = "EXE" # EXE | STATIC | SHARED 
win32_executable = false
macos_bundle = false

[presets]
binary_dir = "${sourceDir}/out/build/${presetName}"
architecture = "x64"               # "x64", "x86", "arm", "arm64" (also feeds intelliSenseMode)
generator = "Ninja"                # See https://cmake.org/cmake/help/latest/manual/cmake-generators.7.html               
msvc_runtime_mode = "MD"           # "MD", "MT"
msvc_toolset = "v145"              # See https://cmake.com.cn/cmake/help/latest/variable/MSVC_VERSION.html#variable:MSVC_VERSION
use_sanitizers = false

[presets.user]
install_dir = "${sourceDir}/out/install/${presetGroup}"
compilers = ["clang-cl", "msvc"]            # "msvc", "clang", "gcc", "clang-cl"
build_types = ["Debug", "Release"]  # ["Debug", "RelWithDebInfo", "Release", "MinSizeRel"]

[qt]
qt_enabled = false
sdk_dir = "E:/Qt/6.6.2/msvc2019_64"
components = ["Widgets"]
# Qt Creator writes these vendor checksums into the presets it manages; they are tied to this Qt
# install, so Qt Creator will rewrite them after a Qt upgrade. Empty = omit that vendor block.
presets_checksum = "67SmY24ZeVbebyKD0fGfIzb/bGI="  # root-level vendor "qt-project.org/Presets"
qt_checksum = "wVa86FgEkvdCTVp1/nxvrkaemJc="       # vendor "qt-project.org/Qt" inside "base"
